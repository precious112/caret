<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<!--
			The chrome loads nothing remote: its scripts are bundled, its styles are
			bundled, and the only network host it may reach is the project's own Vite
			server. Anything beyond that is a bug, so it is refused here rather than
			relied on not to happen.
		-->
		<meta
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:* http://127.0.0.1:*; font-src 'self' data:;"
			http-equiv="Content-Security-Policy"
		/>
		<title>Caret</title>
	</head>
	<body>
		<div id="root"></div>
		<script src="/src/main.tsx" type="module" ></script>
	</body>
</html>
